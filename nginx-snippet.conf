# VoidFast — сниппет для nginx (вставить в server { ... }).
# Сайт статический: никаких php-fpm и баз данных ему не нужно.

root /var/www/voidfast;
index index.html;
charset utf-8;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Download-Options "noopen" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; media-src 'none'; worker-src 'none'; manifest-src 'self'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

location / {
    try_files $uri $uri/ =404;
}

location /download/ {
    # установщик большой: отдаём как файл и не даём nginx буферизовать целиком
    add_header Content-Disposition 'attachment; filename="VoidSetup.exe"';
    sendfile on;
    aio threads;
}

location ~* \.(php|phtml|py|cgi|sh|pl)$ {
    deny all;
}

location ~ /\. {
    deny all;
}

error_page 404 /404.html;
